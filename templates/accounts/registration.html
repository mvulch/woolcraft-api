{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
        <div class="col-12 col-lg-6">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif%}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <h2 class="mb-4">Регистрация</h2>
            <form method="post">
                {% csrf_token %}

                <div class="form-floating mb-3">
                    <input type="username"
                           name="{{ form.username.name }}"
                           class="form-control"
                           id="{{ form.username.id_for_label }}"
                           value="{{ form.username.value|default:'' }}"
                           placeholder="Username"
                           required>
                    <label for="{{ form.username.id_for_label }}">Потребителско име</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email"
                           name="{{ form.email.name }}"
                           class="form-control"
                           id="{{ form.email.id_for_label }}"
                           value="{{ form.email.value|default:'' }}"
                           placeholder="name@ecample.com"
                           required>
                    <label for="{{ form.email.id_for_label }}">Имейл адрес</label>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input type="first_name"
                                   name="{{ form.first_name.name }}"
                                   class="form-control"
                                   id="{{ form.first_name.id_for_label }}"
                                   value="{{ form.first_name.value|default:'' }}"
                                   placeholder="Name"
                                   required>
                            <label for="{{ form.first_name.id_for_label }}">Име</label>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input type="last_name"
                                   name="{{ form.last_name.name }}"
                                   class="form-control"
                                   id="{{ form.last_name.id_for_label }}"
                                   value="{{ form.last_name.value|default:'' }}"
                                   placeholder="Name"
                                   required>
                            <label for="{{ form.last_name.id_for_label }}">Фамилия</label>
                        </div>
                    </div>
                </div>
                <div class="form-floating mb-4">
                    <input type="password"
                           name="{{ form.password.name }}"
                           class="form-control"
                           id="{{ form.password.id_for_label }}"
                           placeholder="Password"
                           required>
                    <label for="{{ form.password.id_for_label }}">Парола</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password"
                           name="{{ form.confirm_password.name }}"
                           class="form-control"
                           id="{{ form.confirm_password.id_for_label }}"
                           placeholder="Password"
                           required>
                    <label for="{{ form.confirm_password.id_for_label }}">Потвърдете парола</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Регистрирай се</button>

            </form>
        </div>
</div>
{% endblock %}
